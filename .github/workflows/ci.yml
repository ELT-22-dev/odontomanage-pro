name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # See CLAUDE.md — @tailwindcss/vite wants Vite 5-7, this repo pins Vite 8.
      - run: npm install --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm run test

      - name: Lint
        run: npx eslint . --ext ts,tsx --report-unused-disable-directives
        # Known pre-existing violations not yet triaged — see docs/ARQUITETURA.md
        # "Dívidas técnicas" for the list. Flip this to blocking once they're fixed.
        continue-on-error: true

      # Real production build (prerenders every route). Uses placeholder Supabase
      # credentials — this only proves the build doesn't crash, it never talks to
      # a real project. It succeeds because every browser-only read (auth state,
      # localStorage) is wrapped in <BlinkClientBoundary>/ssr:false, so nothing at
      # build time actually calls Supabase.
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key
