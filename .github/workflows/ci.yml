name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # See CLAUDE.md — @tailwindcss/vite wants Vite 5-7, this repo pins Vite 8.
      - run: npm install --legacy-peer-deps

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm run test

      - name: Lint
        run: npx eslint . --ext ts,tsx --report-unused-disable-directives
        # Known pre-existing violations not yet triaged. Flip this to blocking
        # once they're fixed.
        continue-on-error: true

      # Real production build (prerenders every route). No env vars needed —
      # this app has no backend, everything is static + localStorage.
      - name: Build
        run: npm run build
